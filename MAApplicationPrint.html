<script>

 body+=sec(2,'PERSONAL INFORMATION')+'<div class="tb g4 nm">'+c('Surname','Surname')+c('First Name','FirstName')+c('Middle Name','MiddleName')+c('Suffix','Suffix')+'</div><div class="tb g4 nxt">'+c('Date of Birth','Birthdate')+c('Place of Birth','BirthPlace')+c('Mobile Number','Mobile')+c('Sex','SexualOrient')+c('Gender Identity','GenderOrient')+c('Religion','Religion')+c('Religion (Other)','ReligionOther')+c('Facebook Account Link','Facebook')+c('House / Street','AddressLine1')+c('Subdivision / Village','AddressLine2')+c('Barangay','Barangay')+c('City / Municipality','City')+c('Province','Province')+'</div>';
 function prow(t,p){

 '.nm .c{min-height:.5in}.nm .cv{font:800 11pt Arial,sans-serif;text-transform:uppercase;color:#062E70}.nxt{margin-top:-1px;border-top:0}'+
 '.sec{display:flex;align-items:center;gap:.1in;margin:.13in 0 .05in;padding:.04in .1in;background:#062E70;color:#fff;font:800 9.2pt Arial,sans-serif;letter-spacing:.1em;border-bottom:2px solid #FF941F}.sn{display:inline-block;min-width:.2in;font:800 9.2pt Arial,sans-serif;color:#FF941F}'+
