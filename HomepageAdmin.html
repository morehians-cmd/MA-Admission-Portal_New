<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage Management</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#062E70;--blue:#0648AD;--orange:#FF941F;--light:#EEF4FF;--line:#d3def5;--head:'Poppins',system-ui,sans-serif;--body:'Open Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font:400 clamp(14px,.3vw + 12px,16px)/1.5 var(--body);background:var(--light);color:#14213d}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px clamp(12px,2vw,28px)}
.top strong{font:600 18px var(--head)}.st{margin-left:12px;font-size:13px;background:rgba(255,255,255,.15);border-radius:20px;padding:2px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.b{border:2px solid var(--blue);background:var(--blue);color:#fff;font:600 14px var(--head);padding:8px 16px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}
.b.or{background:var(--orange);border-color:var(--orange);color:var(--navy)}.b.ghost{background:transparent;border-color:#fff}.b.line{background:#fff;color:var(--blue)}.b.sm{padding:4px 10px;font-size:13px}.b:disabled{opacity:.55;cursor:wait}
.lay{display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding:clamp(12px,2vw,24px)}
#tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:70px;align-self:start}
#tabs button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:600 14px var(--head);color:var(--navy);cursor:pointer}
#tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}#tabs i{color:var(--orange);font-style:normal;float:right}
#pane{background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2.5vw,28px);min-width:0}
h2{font:600 22px var(--head);color:var(--navy);margin:0 0 4px}.hint{color:#51607d;font-size:13px;margin:0 0 16px}
label{display:block;font:600 13px var(--head);color:var(--navy);margin:12px 0 0}
input,textarea,select{width:100%;margin-top:4px;padding:9px 11px;border:1px solid #b9c8e6;border-radius:8px;font:inherit}textarea{min-height:90px}
input[type=checkbox]{width:auto;margin-right:6px}input.bad{border-color:#c0392b}
.row{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;background:#f9fbff}
.row>header{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 13px var(--head);color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 14px}
.img{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}.img img,.img .ph{width:96px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}.img .ph{display:grid;place-items:center;font-size:12px;color:#888}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;display:none;z-index:60;max-width:90vw}#toast.bad{background:#c0392b}
#lock{padding:40px 20px;text-align:center;color:var(--navy);display:none}
@media(max-width:900px){.lay{grid-template-columns:minmax(0,1fr)}#tabs{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}#tabs button{white-space:nowrap}}
@media(max-height:700px){.top{position:static}#tabs{top:8px}}
</style>
</head>
<body>
<header class="top">
  <div><strong>Homepage Management</strong><span class="st" id="st">Loading…</span></div>
  <div class="acts"><a class="b ghost" id="wp" href="#">Website pages</a><a class="b ghost" id="pv" href="#" rel="noopener">Preview draft</a><button class="b or" id="pub">Publish drafts</button><button class="b ghost" id="out">Sign out</button></div>
</header>
<div id="lock" role="alert"><p id="lockMsg"></p>
  <div id="siBox" style="display:none;max-width:360px;margin:16px auto;text-align:left">
    <label for="siE">Email</label><input id="siE" type="email" autocomplete="username">
    <label for="siP">Password</label><input id="siP" type="password" autocomplete="current-password">
    <p id="siErr" style="color:#c0392b;min-height:1.2em;margin:8px 0 0"></p>
    <button class="b" id="siGo" style="width:100%;margin-top:8px">Sign in</button>
  </div>
</div>
<div class="lay" id="lay"><nav id="tabs" aria-label="Homepage sections"></nav><main id="pane"></main></div>
<div id="toast" role="status"></div>

<script>
var APP_BASE='<?= baseUrl ?>';
/* Defaults mirror Homepage.html DEFAULT_HOME so empty sections start with today's content. Keep in sync. */
var DEF={
 masthead:{tagline:'Learn · Grow · Excel',ids:[{name:'Moreh Academy',short:'MA',logo:'',fb:'https://facebook.com/ilovemoreh'},{name:'Moreh Global Innovative College',short:'MG',logo:'',fb:'https://facebook.com/MorehGlobal2019'},{name:'Moreh College',short:'MC',logo:'',fb:'https://facebook.com/morehcollege'}]},
 hero:{title:'Welcome to',name:'Moreh Academy',subtitle:'School of Righteousness and Excellence.',desc:'Welcome to Moreh Academy. School of Righteousness and Excellence.',enroll:{label:'Enroll Now!',to:'#create'},discover:{label:'Discover Moreh Academy',to:'route:about'},slides:['','',''],intervalMs:6500},
 values:{items:[{label:'Quality Education',icon:'📘',on:true},{label:'Holistic Development',icon:'🧍',on:true},{label:'Academic Excellence',icon:'🏆',on:true},{label:'Supportive Community',icon:'🤝',on:true},{label:'A Brighter Future',icon:'⭐',on:true}]},
 admission:{title:'Your Journey to Moreh Academy',sub:'Six simple steps toward becoming a Moreh Academy student.',steps:[{t:'Create an Account',d:'Register your applicant account.',i:'👤',on:true},{t:'Complete Application',d:'Fill out the application form.',i:'📝',on:true},{t:'Submit Requirements',d:'Upload the required documents.',i:'📎',on:true},{t:'Application Review',d:'Application assessment by the school.',i:'🔍',on:true},{t:'Admission Decision',d:'Receive your application result.',i:'📬',on:true},{t:'Enrollment Confirmation',d:'Complete your enrollment.',i:'✅',on:true}]},
 about:{heading:'Building a Strong Foundation for Lifelong Success',text:'Moreh Academy is a learning community committed to providing excellent and values-driven education from Kindergarten to Grade 12.',photo:'',linkLabel:'Learn More'},
 programs:{title:'Academic Programs',items:[{name:'Kindergarten',desc:'A caring start to learning.',on:true},{name:'Elementary',desc:'Strong foundations in core subjects.',on:true},{name:'Junior High School',desc:'Skills and character for adolescence.',on:true},{name:'Senior High School',desc:'Clusters that prepare for college and career.',on:true},{name:'College Program',desc:'Higher education pathways.',on:true}]},
 news:{title:'News & Announcements',items:[]},
 footer:{loc:'Moreh Academy, Taguig City, Philippines',phone:'Admissions: 0961 876 6886',email:'registrar@morehacademy.com',fb:'https://facebook.com/ilovemoreh',yt:'https://youtube.com/'},
 display:{order:['admission','about','programs','news'],hidden:[]}};
var T=function(k,l,x){return Object.assign({k:k,l:l,t:'text'},x||{})};
var PANELS=[
 {id:'masthead',label:'Institutional Masthead',hint:'Logos, names and Facebook pages of the three institutions.',f:[T('tagline','Tagline'),{k:'ids',t:'list',l:'Institution',fixed:true,it:[T('name','Institution name'),T('short','Initials (shown when there is no logo)'),{k:'logo',l:'Logo',t:'img',kind:'logo'},T('fb','Facebook URL',{t:'url'})]}]},
 {id:'hero',label:'Homepage Hero',hint:'Heading, buttons and the three campus photographs.',f:[T('title','Heading, first line'),T('name','Heading, highlighted line'),T('subtitle','Subtitle'),T('desc','Description',{t:'area'}),T('enroll.label','Enroll button label'),T('enroll.to','Enroll button destination',{hint:'#create opens Create Account. #signin opens Sign In.'}),T('discover.label','Discover button label'),T('discover.to','Discover button destination',{hint:'route:about opens the About Us page. Or paste a full https:// link.'}),T('intervalMs','Slide time in milliseconds (3000 to 15000)',{t:'num'}),{k:'slides',t:'imgs',l:'Campus photographs (order = display order)'}]},
 {id:'values',label:'Institutional Values',hint:'Up to 8 values. Use an emoji as the icon.',f:[{k:'items',t:'list',l:'Value',max:8,it:[T('label','Label'),T('icon','Icon (emoji)'),{k:'on',l:'Show this value',t:'bool'}]}]},
 {id:'admission',label:'Admission Process',hint:'Verify these steps against the school\u2019s actual procedure before publishing.',f:[T('title','Section heading'),T('sub','Subtitle'),{k:'steps',t:'list',l:'Step',max:12,it:[T('t','Step title'),T('d','Description'),T('i','Icon (emoji)'),{k:'on',l:'Show this step',t:'bool'}]}]},
 {id:'about',label:'About Preview',hint:'Short introduction shown on the homepage.',f:[T('heading','Heading'),T('text','Text',{t:'area'}),{k:'photo',l:'Photograph',t:'img',kind:'photo'},T('linkLabel','Link label')]},
 {id:'programs',label:'Academic Programs Preview',hint:'Each card links to its dedicated academics page.',f:[T('title','Section heading'),{k:'items',t:'list',l:'Program',max:10,it:[T('name','Program name'),T('desc','Short description'),{k:'on',l:'Show this program',t:'bool'}]}]},
 {id:'news',label:'News & Announcements Preview',hint:'Leave empty to show the “No announcements yet” message.',f:[T('title','Section heading'),{k:'items',t:'list',l:'News item',max:12,it:[T('title','Title'),T('date','Date'),T('summary','Summary',{t:'area'}),T('link','Link (route:news/latest-news or https://…)',{t:'url'})]}]},
 {id:'footer',label:'Footer & Contact',hint:'Shown in the footer and on the Contact page.',f:[T('loc','Location'),T('phone','Contact number'),T('email','Email address',{t:'email'}),T('fb','Facebook URL',{t:'url'}),T('yt','YouTube URL',{t:'url'})]},
 {id:'display',label:'Display Settings',hint:'Show, hide and reorder homepage sections.',f:[]}];
var SEC_LABEL={values:'Institutional values strip',admission:'Admission process',about:'About preview',programs:'Academic programs',news:'News and announcements'};
var S={},ST={},cur='masthead',dirty={},$=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML.replace(/"/g,'&quot;')}
function get(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k]},o)}
function set(o,p,v){var a=p.split('.');while(a.length>1){var k=a.shift();o=o[k]=o[k]||{}}o[a[0]]=v}
function toast(m,bad){var t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},4000)}
/* Session token from Auth.gs sign-in (kept in this tab only). Empty = break-glass Google account only. */
var MEM_TOKEN='';
function TOKEN(){try{return sessionStorage.getItem('ma_token')||MEM_TOKEN}catch(e){return MEM_TOKEN}}
function setToken(t){MEM_TOKEN=t||'';try{t?sessionStorage.setItem('ma_token',t):sessionStorage.removeItem('ma_token')}catch(e){}}
function rpc(fn){var a=[TOKEN()].concat([].slice.call(arguments,1));return new Promise(function(ok,no){
 if(typeof google==='undefined'||!google.script){no(new Error('Backend not connected (preview mode).'));return}
 google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no(new Error((e&&e.message)||'Request failed. Try again.'))})[fn].apply(null,a)})}
function busy(b,on,txt){b.disabled=on;if(txt!=null){b.dataset.t=b.dataset.t||b.textContent;b.textContent=on?txt:b.dataset.t}}

/* ----- form rendering ----- */
function fld(f,v,path){
 var t=f.t,h=f.hint?'<span class="hint" style="display:block;margin:2px 0 0">'+esc(f.hint)+'</span>':'';
 if(t==='bool')return '<label><input type="checkbox" data-p="'+path+'" data-t="bool"'+(v!==false&&v?' checked':'')+'>'+esc(f.l)+'</label>';
 if(t==='area')return '<label>'+esc(f.l)+'<textarea data-p="'+path+'">'+esc(v)+'</textarea></label>'+h;
 if(t==='img')return '<label>'+esc(f.l)+'</label><div class="img">'+(v?'<img src="'+esc(v)+'" alt="">':'<span class="ph">No image</span>')+'<input type="file" accept="image/png,image/jpeg,image/webp" data-up="'+path+'" data-kind="'+(f.kind||'photo')+'" style="width:auto">'+(v?'<button type="button" class="b line sm" data-clr="'+path+'">Remove</button>':'')+'</div>';
 if(t==='list'){var arr=v||[];return '<div>'+arr.map(function(it,i){return '<div class="row"><header><span>'+esc(f.l)+' '+(i+1)+'</span><span>'+(i>0?'<button type="button" class="b line sm" data-act="up" data-p="'+path+'" data-i="'+i+'" aria-label="Move up">↑</button> ':'')+(i<arr.length-1?'<button type="button" class="b line sm" data-act="down" data-p="'+path+'" data-i="'+i+'" aria-label="Move down">↓</button> ':'')+(f.fixed?'':'<button type="button" class="b line sm" data-act="del" data-p="'+path+'" data-i="'+i+'">Remove</button>')+'</span></header><div class="grid2">'+f.it.map(function(g){return fld(g,it[g.k],path+'.'+i+'.'+g.k)}).join('')+'</div></div>'}).join('')+(f.fixed||arr.length>=(f.max||50)?'':'<button type="button" class="b line" data-act="add" data-p="'+path+'">+ Add '+esc(f.l.toLowerCase())+'</button>')+'</div>'}
 if(t==='imgs'){var sl=v||[];return '<label>'+esc(f.l)+'</label>'+sl.map(function(u,i){return '<div class="row"><header><span>Photo '+(i+1)+'</span><span>'+(i>0?'<button type="button" class="b line sm" data-act="up" data-p="'+path+'" data-i="'+i+'">↑</button> ':'')+(i<sl.length-1?'<button type="button" class="b line sm" data-act="down" data-p="'+path+'" data-i="'+i+'">↓</button>':'')+'</span></header>'+fld({t:'img',kind:'photo',l:''},u,path+'.'+i)+'</div>'}).join('')}
 var type=t==='num'?'number':t==='email'?'email':'text';
 return '<label>'+esc(f.l)+'<input type="'+type+'" data-p="'+path+'" data-t="'+(t||'text')+'" value="'+esc(v)+'"></label>'+h}
function displayPanel(d){
 return '<h3 style="font:600 16px var(--head);color:var(--navy)">Visible sections</h3>'+Object.keys(SEC_LABEL).map(function(k){return '<label><input type="checkbox" data-vis="'+k+'"'+(d.hidden.indexOf(k)<0?' checked':'')+'>'+SEC_LABEL[k]+'</label>'}).join('')
 +'<h3 style="font:600 16px var(--head);color:var(--navy);margin-top:22px">Section order</h3><p class="hint">The values strip always sits directly under the hero.</p>'
 +d.order.map(function(k,i){return '<div class="row"><header><span>'+SEC_LABEL[k]+'</span><span>'+(i>0?'<button type="button" class="b line sm" data-ord="up" data-i="'+i+'">↑</button> ':'')+(i<d.order.length-1?'<button type="button" class="b line sm" data-ord="down" data-i="'+i+'">↓</button>':'')+'</span></header></div>'}).join('')}
function tabs(){$('tabs').innerHTML=PANELS.map(function(p){var m=dirty[p.id]?'unsaved':(ST[p.id]&&ST[p.id].hasDraft?'draft':'');return '<button data-tab="'+p.id+'" class="'+(p.id===cur?'on':'')+'">'+esc(p.label)+(m?'<i title="'+m+'">●</i>':'')+'</button>'}).join('')}
function status(){var n=Object.keys(ST).filter(function(k){return ST[k].hasDraft}).length,u=Object.keys(dirty).length;
 $('st').textContent=u?'Unsaved edits in '+u+' panel'+(u>1?'s':''):n?n+' unpublished draft'+(n>1?'s':''):'All changes published'}
function pane(){
 var p=PANELS.filter(function(x){return x.id===cur})[0],d=S[cur];
 $('pane').innerHTML='<h2>'+esc(p.label)+'</h2><p class="hint">'+esc(p.hint)+'</p>'+(cur==='display'?displayPanel(d):p.f.map(function(f){return fld(f,get(d,f.k),f.k)}).join(''))
 +'<div class="bar"><button class="b" id="save">Save draft</button><button class="b line" id="disc">Discard draft</button></div>';
 tabs();status()}
function mark(){dirty[cur]=true;tabs();status()}

/* ----- events ----- */
$('tabs').onclick=function(e){var b=e.target.closest('[data-tab]');if(b){cur=b.dataset.tab;pane()}};
$('pane').addEventListener('input',function(e){var el=e.target,p=el.dataset.p;if(!p)return;
 var v=el.dataset.t==='bool'?el.checked:el.dataset.t==='num'?(el.value===''?null:Number(el.value)):el.value;set(S[cur],p,v);el.classList.remove('bad');mark()});
$('pane').addEventListener('change',function(e){var el=e.target;
 if(el.dataset.vis){var h=S.display.hidden,k=el.dataset.vis,i=h.indexOf(k);if(el.checked&&i>-1)h.splice(i,1);if(!el.checked&&i<0)h.push(k);mark()}
 if(el.dataset.up&&el.files[0])upload(el)});
$('pane').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.ord){var o=S.display.order,i=+b.dataset.i,j=b.dataset.ord==='up'?i-1:i+1,t=o[i];o[i]=o[j];o[j]=t;mark();pane();return}
 if(b.dataset.clr){set(S[cur],b.dataset.clr,'');mark();pane();return}
 if(b.dataset.act){var arr=get(S[cur],b.dataset.p),i=+b.dataset.i,a=b.dataset.act;
  if(a==='add'){var f=findList(b.dataset.p);var n={};f.it.forEach(function(g){n[g.k]=g.t==='bool'?true:''});arr.push(n)}
  if(a==='del')arr.splice(i,1);
  if(a==='up'||a==='down'){var j=a==='up'?i-1:i+1,t=arr[i];arr[i]=arr[j];arr[j]=t}
  mark();pane();return}
 if(b.id==='save')save(b);if(b.id==='disc')discard(b)});
function findList(path){var p=PANELS.filter(function(x){return x.id===cur})[0];return p.f.filter(function(f){return f.k===path})[0]}

function validate(){
 var bad=[];document.querySelectorAll('#pane input[data-p]').forEach(function(el){var v=el.value.trim(),t=el.dataset.t;
  var err=(t==='url'&&v&&!/^(https?:\/\/|route:|#)/i.test(v))||(t==='email'&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v));
  if(err){el.classList.add('bad');bad.push(el)}});
 if(cur==='hero'){var ms=S.hero.intervalMs;if(ms!=null&&(ms<3000||ms>15000))bad.push(1)}
 return bad.length?'Fix the highlighted fields. Links must start with https://, route: or #, and slide time must be 3000 to 15000.':''}
function save(b){var m=validate();if(m){toast(m,true);return}
 busy(b,true,'Saving…');
 rpc('saveHomepageDraft',cur,S[cur]).then(function(){delete dirty[cur];ST[cur]=Object.assign(ST[cur]||{},{hasDraft:true});toast('Draft saved. It is not public until you publish.');pane()})
 .catch(function(e){toast(e.message,true)}).then(function(){busy(b,false,'')})}
function discard(b){if(!confirm('Discard the saved draft for this panel and go back to the published version?'))return;
 busy(b,true,'Working…');
 rpc('discardHomepageDraft',cur).then(load).then(function(){toast('Draft discarded.')}).catch(function(e){toast(e.message,true)}).then(function(){busy(b,false,'')})}
$('pub').onclick=function(){var b=this,u=Object.keys(dirty).length;
 if(u&&!confirm('You have unsaved edits that will not be published. Publish saved drafts anyway?'))return;
 if(!confirm('Publish all saved drafts to the public homepage?'))return;
 busy(b,true,'Publishing…');
 rpc('publishHomepage').then(function(r){return load().then(function(){toast(r.published?'Published '+r.published+' section'+(r.published>1?'s':'')+'.':'No saved drafts to publish.')})})
 .catch(function(e){toast(e.message,true)}).then(function(){busy(b,false,'')})};
window.addEventListener('beforeunload',function(e){if(Object.keys(dirty).length){e.preventDefault();e.returnValue=''}});

/* ----- image upload: resize in the browser, then store in Drive ----- */
function upload(el){var f=el.files[0],kind=el.dataset.kind,path=el.dataset.up,max=kind==='logo'?400:1920;
 if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast('Use a JPG, PNG or WebP image.',true);return}
 var img=new Image(),url=URL.createObjectURL(f);toast('Uploading…');
 img.onload=function(){var r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  var mime=kind==='logo'?'image/png':'image/jpeg',data=c.toDataURL(mime,.85).split(',')[1];
  rpc('uploadHomepageImage',{kind:kind,name:f.name,mime:mime,data:data}).then(function(r){set(S[cur],path,r.url);mark();pane();toast('Image uploaded. Save the draft to keep it.')}).catch(function(e){toast(e.message,true)})};
 img.onerror=function(){toast('That file could not be read as an image.',true)};img.src=url}

/* ----- load ----- */
function load(){return rpc('getHomepageAdminState').then(function(r){
 PANELS.forEach(function(p){S[p.id]=r.sections[p.id]||JSON.parse(JSON.stringify(DEF[p.id]))});
 ST=r.status;dirty={};
 var d=S.display;d.hidden=d.hidden||[];d.order=d.order||DEF.display.order;Object.keys(SEC_LABEL).forEach(function(k){if(k!=='values'&&d.order.indexOf(k)<0)d.order.push(k)});
 d.order=d.order.filter(function(k){return SEC_LABEL[k]&&k!=='values'});
 S.hero.slides=(S.hero.slides||[]).concat(['','','']).slice(0,3);
 $('lock').style.display='none';$('lay').style.display='';pane()})}
$('pv').onclick=function(ev){ev.preventDefault();rpc('createHomepagePreviewTicket').then(function(r){window.open((APP_BASE||'')+'?page=home&preview=draft&pt='+encodeURIComponent(r.ticket),'_blank')}).catch(function(e){toast(e.message,true)})};
function lockOut(msg){
 var na=/Not authorized/i.test(msg);
 $('lay').style.display='none';$('pub').disabled=true;$('out').style.display='none';$('st').textContent='Locked';$('lock').style.display='block';
 $('lockMsg').textContent=na?'Sign in with the Owner account to manage the homepage.':msg;$('siBox').style.display=na?'block':'none'}
function signInOwner(){
 var e=$('siE').value.trim(),p=$('siP').value,b=$('siGo');
 if(!e||!p){$('siErr').textContent='Enter your email and password.';return}
 if(typeof google==='undefined'||!google.script){$('siErr').textContent='Backend not connected (preview mode).';return}
 b.disabled=true;b.textContent='Signing in…';$('siErr').textContent='';
 function done(){b.disabled=false;b.textContent='Sign in'}
