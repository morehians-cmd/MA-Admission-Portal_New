<style>
:root{--navy:#062E70;--blue:#0648AD;--orange:#FF941F;--light:#EEF4FF;--ink:#14213d;--head:'Poppins',system-ui,sans-serif;--body:'Open Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 var(--body);color:var(--ink);background:#f7f9ff}.wrap{max-width:1200px;margin:auto;padding:0 24px}
.top{background:var(--navy);color:#fff}.top .wrap{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:800 18px var(--head)}.top a{color:#fff;text-decoration:none;margin-left:18px;font-weight:600}
main{padding:42px 0 72px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.head h1{margin:0;color:var(--navy);font:800 clamp(28px,4vw,42px) var(--head)}.head p{margin:6px 0;color:#51607d}
.card{background:#fff;border:1px solid #d8e3f8;border-radius:14px;padding:24px;margin-top:20px;box-shadow:0 4px 16px rgba(6,46,112,.06)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.wide{grid-column:1/-1}
label{display:block;font:600 13px var(--head);color:var(--navy);margin-bottom:5px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #b9c8e6;border-radius:8px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}
.section{grid-column:1/-1;color:var(--blue);font:700 16px var(--head);padding:10px 0 4px;border-bottom:1px solid #d8e3f8}
.btn{border:2px solid var(--orange);background:var(--orange);color:#fff;font:700 14px var(--head);padding:10px 18px;border-radius:9px;cursor:pointer}.btn.blue{background:var(--blue);border-color:var(--blue)}.btn.secondary{background:#fff;border-color:#b9c8e6;color:var(--navy)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{padding:10px 12px;border-radius:8px;background:var(--light);color:var(--navy);margin-top:14px}.error{background:#fff1f1;color:#9d2c22;border:1px solid #e7b7b2}.success{background:#eef9f1;color:#247a3b;border:1px solid #b9dfc2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:var(--light);border-radius:12px;padding:15px}.stat span{display:block;color:#51607d;font-size:12px}.stat strong{display:block;color:var(--blue);font:800 28px var(--head)}
.table{width:100%;border-collapse:collapse}.table th{background:var(--navy);color:#fff;text-align:left;font:600 12px var(--head);padding:9px}.table td{padding:9px;border-bottom:1px solid #d8e3f8;font-size:13px}.table tr:hover td{background:#f6f9ff}.scroll{overflow:auto}.hidden{display:none!important}
@media(max-width:600px){.wrap{padding:0 15px}.top .wrap{align-items:flex-start;padding-top:12px;padding-bottom:12px;flex-direction:column}.top a{margin-left:0;margin-right:16px}}
</style>
